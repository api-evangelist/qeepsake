name: Qeepsake
description: Qeepsake is a family memory-keeping and baby-journaling service that helps parents capture
  their children's milestones and everyday moments by responding to scheduled text prompts or free-journaling
  in the mobile app, then turning those entries into digital and printed family storybooks. Operated by
  Tinybeans USA Ltd, Qeepsake is a consumer mobile application (iOS and Android) with membership tiers; it
  publishes no public API, developer portal, or SDK. This profile was surfaced as a Techstars portfolio
  company and enriched with an identity and domain-security pass.
